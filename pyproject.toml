[project]
name = "cuad-qlora-vllm"
version = "0.1.0"
description = "Fine-tune Qwen3-4B with QLoRA for CUAD clause extraction and evaluate it against baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

# GPU-only packages (unsloth, vllm) are installed in the Kaggle notebooks; they don't install on macOS.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
rag = [
    "faiss-cpu>=1.8,<1.10",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.4,<=2.9.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuad_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
