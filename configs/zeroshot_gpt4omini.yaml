# Baseline A (API variant): zero-shot GPT-4o-mini on every (chunk, category) pair.
# ~20.7k requests / ~68M prompt tokens on the test split; most of each prompt is a cached prefix.
run_name: zeroshot_gpt4omini
split: test
mode: full

full:
  chunk_chars: 12000
  overlap_chars: 1500

model:
  model: gpt-4o-mini
  max_tokens: 1024
  concurrency: 32
