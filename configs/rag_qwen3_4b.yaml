# Baseline B (4B): hybrid BM25 + dense retrieval, then one Qwen3-4B-Instruct request per
# (contract, category). Same model as the zero-shot and fine-tuned runs, so the three differ only by
# method; about half the compute of the 8B variant, which is too slow on free T4s.
# Needs the rag dependency group: uv sync --group rag
run_name: rag_qwen3_4b
split: test
mode: rag

rag:
  passage_chars: 2000
  passage_overlap: 300
  # Share of test gold spans fully inside the retrieved passages, by top_k (prompt tokens on test):
  #   4: 49.7% (7.4M)   8: 66.5% (13.2M)   12: 76.6% (18.1M)   16: 83.0% (22.0M)
  # Retrieval recall caps the baseline's coverage recall, so use 16: still 40% of full-context cost.
  top_k: 16
  embed_model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  embed_device: cpu

model:
  model: Qwen/Qwen3-4B-Instruct-2507
  base_url: http://localhost:8000/v1
  max_tokens: 1024
  # Every RAG prompt is unique (~5.3k tokens, no shared prefix), so requests queue on the GPU; keep
  # fewer in flight with a long timeout (the 8B variant timed out at 64 in flight and 600 s).
  concurrency: 32
  timeout_s: 1800
